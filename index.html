<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AR Menu (WebXR)</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:sans-serif;background:#000}

/* overlay */
#overlay{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d0d0d,#1a1200);
  color:#fff;text-align:center;padding:30px;
}
.start-btn{
  margin-top:20px;
  padding:14px 40px;
  border-radius:40px;
  border:none;
  background:#e8a838;
  font-weight:bold;
}

/* bottom menu */
#bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  padding:10px;
}
.strip{display:flex;overflow-x:auto;gap:10px}
.card{
  min-width:100px;
  background:#111;
  color:#fff;
  padding:10px;
  border-radius:12px;
  text-align:center;
  border:1px solid #333;
}
.card.active{border-color:#e8a838}

/* info */
#info{
  position:fixed;top:0;left:0;right:0;
  background:#111;
  color:#fff;
  padding:10px;
  display:none;
  z-index:30;
}

/* canvas */
canvas{position:fixed;inset:0;z-index:1}
</style>
</head>

<body>

<div id="overlay">
  <h1>🍜 AR MENU</h1>
  <p>Хоол сонгоод ширээн дээр тавина</p>
  <button class="start-btn" id="startBtn">AR эхлүүлэх</button>
</div>

<div id="info">
  <div id="iname"></div>
  <div id="idesc"></div>
</div>

<div id="bottom">
  <div class="strip" id="strip"></div>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/webxr/ARButton.js';

const MENU = [
  {name:"Гоймон", desc:"Амттай гоймон", glb:"noodle.glb"},
  {name:"Пицца", desc:"Бяслагтай пицца", glb:"pizza.glb"},
  {name:"Бургер", desc:"Шүүслэг бургер", glb:"burger.glb"}
];

let scene, camera, renderer;
let loader;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;

let currentModel = null;
let selectedIndex = null;

document.getElementById("startBtn").onclick = init;

function init(){

  document.getElementById("overlay").style.display="none";

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera();

  renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  document.body.appendChild(
    ARButton.createButton(renderer,{
      requiredFeatures:['hit-test']
    })
  );

  scene.add(new THREE.AmbientLight(0xffffff,1));

  loader = new GLTFLoader();

  // RETICLE (ширээ илрүүлэгч)
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.1,0.12,32).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({color:0xe8a838})
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  buildMenu();

  renderer.setAnimationLoop(render);
}

function buildMenu(){
  const strip = document.getElementById("strip");
  MENU.forEach((m,i)=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML = m.name;
    div.onclick = ()=>select(i,div);
    strip.appendChild(div);
  });
}

function select(i,el){

  selectedIndex = i;

  document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");

  const item = MENU[i];

  document.getElementById("info").style.display="block";
  document.getElementById("iname").innerText=item.name;
  document.getElementById("idesc").innerText=item.desc;

  loadModel(item.glb);
}

function loadModel(path){

  loader.load(path,(gltf)=>{

    currentModel = gltf.scene;

    currentModel.scale.set(1,1,1);

  });

}

function render(timestamp, frame){

  if(frame){

    const session = renderer.xr.getSession();
    const referenceSpace = renderer.xr.getReferenceSpace();

    if(!hitTestSourceRequested){

      session.requestReferenceSpace("viewer").then(space=>{
        session.requestHitTestSource({space}).then(source=>{
          hitTestSource = source;
        });
      });

      session.addEventListener("end",()=>{
        hitTestSourceRequested=false;
        hitTestSource=null;
      });

      hitTestSourceRequested=true;
    }

    if(hitTestSource){

      const hitTestResults = frame.getHitTestResults(hitTestSource);

      if(hitTestResults.length>0){

        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

      } else {
        reticle.visible=false;
      }
    }
  }

  renderer.render(scene,camera);
}

// TAP → ширээн дээр тавих
document.body.addEventListener("click",()=>{

  if(!reticle.visible || !currentModel) return;

  const clone = currentModel.clone();

  clone.position.setFromMatrixPosition(reticle.matrix);
  clone.quaternion.setFromRotationMatrix(reticle.matrix);

  scene.add(clone);

});

</script>
</body>
</html>
