<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>AR Меню</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif}

#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}

#overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d0d0d,#1a1200);
  color:#fff;padding:32px;transition:opacity .5s;
}
#overlay.hidden{opacity:0;pointer-events:none}
.logo-big{font-size:64px;margin-bottom:16px;animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ov-title{font-size:28px;font-weight:700;letter-spacing:3px;margin-bottom:10px}
.ov-sub{font-size:14px;color:rgba(255,255,255,.5);text-align:center;line-height:1.7;margin-bottom:40px}
.start-btn{
  background:#e8a838;color:#000;border:none;border-radius:50px;
  padding:16px 44px;font-size:17px;font-weight:700;cursor:pointer;
  box-shadow:0 0 32px rgba(232,168,56,.5);
}

#err-panel{
  position:fixed;inset:0;z-index:60;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.96);color:#fff;padding:32px;text-align:center;
}
.err-steps{background:rgba(255,255,255,.06);border-radius:16px;padding:18px 20px;text-align:left;width:100%;max-width:360px;margin-bottom:24px}
.err-step{font-size:13px;color:rgba(255,255,255,.75);padding:8px 0;border-bottom:.5px solid rgba(255,255,255,.08);line-height:1.5}
.err-step:last-child{border:none}
.err-step b{color:#e8a838}
.retry-btn{background:#e8a838;color:#000;border:none;border-radius:50px;padding:14px 36px;font-size:16px;font-weight:700;cursor:pointer}

#info{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:rgba(10,10,10,.93);
  border-bottom:.5px solid rgba(232,168,56,.3);
  padding:16px 52px 16px 20px;display:none;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  animation:slideDown .3s ease;
}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.info-row{display:flex;align-items:center;gap:16px}
.info-emoji{font-size:50px;flex-shrink:0}
.info-name{font-size:19px;font-weight:700;color:#fff;margin-bottom:3px}
.info-desc{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:5px}
.info-price{font-size:22px;font-weight:800;color:#e8a838}
.info-close{
  position:absolute;top:14px;right:14px;
  background:rgba(255,255,255,.1);border:none;color:#fff;
  width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* Canvas — full area above bottom strip, touch enabled */
#three-canvas{
  position:fixed;
  left:50%;top:calc(50% - 40px);
  transform:translate(-50%,-58%);
  width:320px;height:320px;
  z-index:10;display:none;
  touch-action:none;
}

/* Gesture hint */
#gesture-hint{
  position:fixed;left:50%;z-index:11;
  transform:translateX(-50%);
  display:none;
  background:rgba(0,0,0,.55);border-radius:20px;
  padding:5px 14px;font-size:12px;color:rgba(255,255,255,.6);
  white-space:nowrap;pointer-events:none;
}

#loading{
  position:fixed;inset:0;z-index:45;display:none;
  align-items:center;justify-content:center;
  flex-direction:column;gap:16px;color:#fff;
  background:rgba(0,0,0,.55);
}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#e8a838;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  padding:0 12px 28px;display:none;
}
.hint-txt{
  text-align:center;color:rgba(255,255,255,.55);font-size:12px;
  margin-bottom:10px;background:rgba(0,0,0,.55);border-radius:20px;
  padding:5px 14px;display:inline-block;width:100%;
}
.scroll-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-strip::-webkit-scrollbar{display:none}
.strip-card{
  min-width:112px;flex-shrink:0;
  background:rgba(15,15,15,.92);border:.5px solid rgba(255,255,255,.12);
  border-radius:16px;padding:12px 10px;cursor:pointer;
  transition:border-color .2s,transform .15s;
  backdrop-filter:blur(8px);text-align:center;
}
.strip-card.active{border-color:#e8a838;box-shadow:0 0 14px rgba(232,168,56,.35)}
.strip-card:active{transform:scale(.96)}
.strip-emoji{font-size:28px;margin-bottom:5px}
.strip-name{font-size:11px;font-weight:600;color:#fff;margin-bottom:3px;line-height:1.3}
.strip-price{font-size:11px;color:#e8a838;font-weight:700}

#glow-ring{
  position:fixed;left:50%;top:50%;
  transform:translate(-50%,60px);
  width:160px;height:24px;
  background:radial-gradient(ellipse,rgba(232,168,56,.45) 0%,transparent 70%);
  z-index:9;display:none;
  animation:ringPulse 2s ease-in-out infinite;
}
@keyframes ringPulse{
  0%,100%{opacity:.6;transform:translate(-50%,60px) scaleX(1)}
  50%{opacity:.25;transform:translate(-50%,60px) scaleX(.6)}
}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<div id="glow-ring"></div>
<canvas id="three-canvas"></canvas>
<div id="gesture-hint"></div>

<div id="overlay">
  <div class="logo-big">🍜</div>
  <div class="ov-title">AR МЕНЮ</div>
  <div class="ov-sub">Доороос хоол сонгоход<br>камер дээр 3D загвар харагдана</div>
  <button class="start-btn" onclick="startAR()">📷 Камер нээх</button>
</div>

<div id="err-panel">
  <div style="font-size:52px;margin-bottom:16px">📵</div>
  <div style="font-size:20px;font-weight:700;color:#ff6b6b;margin-bottom:10px">Камер нэвтрэх боломжгүй</div>
  <div class="err-steps">
    <div class="err-step">1. Chrome дээрх <b>🔒 цоож</b> дарна уу</div>
    <div class="err-step">2. <b>Сайтын тохиргоо → Камер</b></div>
    <div class="err-step">3. <b>Зөвшөөрөх</b> болгоно уу</div>
    <div class="err-step">4. Хуудсыг <b>refresh</b> хийнэ үү</div>
  </div>
  <button class="retry-btn" onclick="location.reload()">🔄 Дахин оролдох</button>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:14px;color:rgba(255,255,255,.7)" id="loading-txt">Ачааллаж байна...</div>
</div>

<div id="info">
  <button class="info-close" onclick="closeInfo()">✕</button>
  <div class="info-row">
    <div class="info-emoji" id="iEmoji"></div>
    <div>
      <div class="info-name" id="iName"></div>
      <div class="info-desc" id="iDesc"></div>
      <div class="info-price" id="iPrice"></div>
    </div>
  </div>
</div>

<div id="bottom">
  <div class="hint-txt">👇 Хоол сонгоход 3D загвар харагдана</div>
  <div class="scroll-strip" id="strip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const MENU = [
  {name:"Гоймон",   price:"₮12,000", desc:"Гоймон, өндөг, гүчүжан",              glb:"noodle.glb",  emoji:"🍜"},
  {name:"Пицца",    price:"₮25,000", desc:"Хиам, бяслаг, гурил, BBQ соус",       glb:"pizza.glb",   emoji:"🍕"},
  {name:"Бургер",   price:"₮18,000", desc:"Шарсан мах, помидор, бяслаг, байцаа", glb:"burger.glb",  emoji:"🍔"},
  {name:"Хот дог",  price:"₮5,000",  desc:"Франкфурт, горчица",                  glb:"hotdog.glb",  emoji:"🌭"},
];

let renderer, scene, camera, clock;
let currentModel = null;
let activeIdx    = null;
const loadedModels = {};

// ── Gesture state ──────────────────────────────────
let modelRotY  = 0;   // current Y rotation (radians)
let modelScale = 1.8; // current scale (Three.js units)
const SCALE_MIN = 0.5;
const SCALE_MAX = 5.0;

// 1-finger drag
let drag1 = null; // {x, rotY}

// 2-finger pinch
let pinch = null; // {dist, scale}

// Auto-rotate when no touch
let autoRotate  = true;
let lastTouchTime = 0;
const AUTO_RESUME_MS = 2000; // resume auto-rotate 2s after last touch

// ── Start ──────────────────────────────────────────
async function startAR() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
  } catch(e1) {
    try { stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    catch(e2) { document.getElementById('err-panel').style.display='flex'; return; }
  }

  const vid = document.getElementById('video');
  vid.srcObject = stream;
  vid.style.display = 'block';
  await vid.play().catch(()=>{});

  document.getElementById('overlay').classList.add('hidden');
  initThree();
  buildStrip();
  document.getElementById('bottom').style.display = 'block';

  // Preload all GLBs in background
  MENU.forEach(item => loadGLB(item.glb, ()=>{}));
}

// ── Three.js ───────────────────────────────────────
function initThree() {
  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0,0);
  renderer.setSize(320,320);

  scene  = new THREE.Scene();
  clock  = new THREE.Clock();
  camera = new THREE.PerspectiveCamera(45,1,0.01,100);
  camera.position.set(0,1.2,3.5);
  camera.lookAt(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const dir = new THREE.DirectionalLight(0xfff5e0,1.4);
  dir.position.set(2,4,3); scene.add(dir);
  const fill = new THREE.PointLight(0xe8a838,0.5,12);
  fill.position.set(-2,2,1); scene.add(fill);
  scene.add(new THREE.DirectionalLight(0xffffff,0.3)).position.set(0,-2,-3);

  // Touch events on canvas
  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove',  onTouchMove,  {passive:false});
  canvas.addEventListener('touchend',   onTouchEnd,   {passive:false});

  window.addEventListener('resize',()=>{
    renderer.setSize(320,320);
    camera.updateProjectionMatrix();
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (!currentModel) { renderer && renderer.render(scene,camera); return; }

  const t = clock.getElapsedTime();

  // Auto-rotate resumes after idle
  if (autoRotate) {
    modelRotY += 0.008;
  }

  currentModel.rotation.y = modelRotY;
  currentModel.position.y = Math.sin(t * 1.1) * 0.06;

  renderer.render(scene, camera);
}

// ── Touch handlers ─────────────────────────────────
function onTouchStart(e) {
  e.preventDefault();
  lastTouchTime = Date.now();
  autoRotate = false;

  if (e.touches.length === 1) {
    drag1 = {x: e.touches[0].clientX, rotY: modelRotY};
    pinch = null;
    showHint('☝️ Эргүүлэх');
  } else if (e.touches.length === 2) {
    const d = touchDist(e.touches);
    pinch = {dist: d, scale: modelScale};
    drag1 = null;
    showHint('🤏 Томруулах / жижигрүүлэх');
  }
}

function onTouchMove(e) {
  e.preventDefault();
  lastTouchTime = Date.now();

  if (e.touches.length === 1 && drag1) {
    const dx = e.touches[0].clientX - drag1.x;
    // 300px swipe = 2π rotation
    modelRotY = drag1.rotY + (dx / 300) * Math.PI * 2;
    if (currentModel) currentModel.rotation.y = modelRotY;

  } else if (e.touches.length === 2 && pinch) {
    const d = touchDist(e.touches);
    const ratio = d / pinch.dist;
    modelScale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, pinch.scale * ratio));
    if (currentModel) {
      currentModel.scale.setScalar(modelScale);
    }
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  drag1 = null;
  pinch = null;
  hideHint();

  // Resume auto-rotate after 2s idle
  setTimeout(()=>{
    if (Date.now() - lastTouchTime >= AUTO_RESUME_MS) {
      autoRotate = true;
    }
  }, AUTO_RESUME_MS);
}

function touchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

// ── Hint label ─────────────────────────────────────
let hintTimer;
function showHint(msg) {
  const el = document.getElementById('gesture-hint');
  const canvas = document.getElementById('three-canvas');
  const rect = canvas.getBoundingClientRect();
  el.textContent = msg;
  el.style.top  = (rect.top - 32) + 'px';
  el.style.display = 'block';
  clearTimeout(hintTimer);
}
function hideHint() {
  hintTimer = setTimeout(()=>{
    document.getElementById('gesture-hint').style.display='none';
  }, 800);
}

// ── GLB loader ─────────────────────────────────────
function loadGLB(glbFile, onDone) {
  if (loadedModels[glbFile]) { onDone(loadedModels[glbFile]); return; }
  new THREE.GLTFLoader().load(glbFile, gltf => {
    const model = gltf.scene;
    const box   = new THREE.Box3().setFromObject(model);
    const size  = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const sc = 1.8 / maxDim;
    model.scale.setScalar(sc);
    const center = box.getCenter(new THREE.Vector3());
    model.position.set(-center.x*sc, -center.y*sc, -center.z*sc);
    loadedModels[glbFile] = model;
    onDone(model);
  }, undefined, err => { console.warn(err); onDone(null); });
}

// ── Select / close ─────────────────────────────────
function selectItem(idx) {
  if (activeIdx === idx) { closeInfo(); return; }
  activeIdx = idx;
  const item = MENU[idx];

  document.querySelectorAll('.strip-card').forEach((el,i) => el.classList.toggle('active',i===idx));
  document.getElementById('iEmoji').textContent = item.emoji;
  document.getElementById('iName').textContent  = item.name;
  document.getElementById('iDesc').textContent  = item.desc;
  document.getElementById('iPrice').textContent = item.price;
  document.getElementById('info').style.display = 'block';

  showModel(item);
}

function showModel(item) {
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  document.getElementById('three-canvas').style.display = 'none';
  document.getElementById('glow-ring').style.display    = 'none';

  if (!loadedModels[item.glb]) {
    document.getElementById('loading').style.display    = 'flex';
    document.getElementById('loading-txt').textContent  = item.name + ' ачааллаж байна...';
  }

  loadGLB(item.glb, model => {
    document.getElementById('loading').style.display = 'none';
    if (!model) return;

    const clone = model.clone();
    // Reset gesture state for new model
    modelRotY  = 0;
    modelScale = 1.8;
    autoRotate = true;
    clone.scale.setScalar(modelScale);
    scene.add(clone);
    currentModel = clone;

    document.getElementById('three-canvas').style.display = 'block';
    document.getElementById('glow-ring').style.display    = 'block';
  });
}

function closeInfo() {
  activeIdx = null;
  document.getElementById('info').style.display         = 'none';
  document.getElementById('three-canvas').style.display = 'none';
  document.getElementById('glow-ring').style.display    = 'none';
  document.querySelectorAll('.strip-card').forEach(el => el.classList.remove('active'));
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
}

// ── Strip ──────────────────────────────────────────
function buildStrip() {
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  MENU.forEach((item,i) => {
    const div = document.createElement('div');
    div.className = 'strip-card';
    div.innerHTML = `<div class="strip-emoji">${item.emoji}</div><div class="strip-name">${item.name}</div><div class="strip-price">${item.price}</div>`;
    div.onclick = () => selectItem(i);
    strip.appendChild(div);
  });
}
</script>
</body>
</html>
