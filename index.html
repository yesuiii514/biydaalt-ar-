<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cam Test</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:16px}
video{width:100%;border-radius:12px;margin:12px 0;display:none}
.r{padding:10px;margin:6px 0;border-radius:8px;font-size:14px;line-height:1.6}
.ok{background:#1a3a1a;color:#4caf50}
.er{background:#3a1a1a;color:#f44336}
.wa{background:#2a2a1a;color:#ff9800}
button{display:block;width:100%;margin:8px 0;background:#e8a838;color:#000;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<h2 style="margin-bottom:12px">📷 Камер тест</h2>
<div id="log"></div>
<video id="v" autoplay playsinline muted></video>
<button onclick="test()">Камер нээх</button>
<button onclick="location.reload()">🔄 Refresh</button>

<script>
const log = document.getElementById('log');
const vid = document.getElementById('v');

function add(msg, cls='wa') {
  const d = document.createElement('div');
  d.className = 'r ' + cls;
  d.innerHTML = msg;
  log.appendChild(d);
}

// Auto info
add('🌐 Protocol: <b>' + location.protocol + '</b> — ' + (location.protocol==='https:' ? '✅ HTTPS OK' : '❌ HTTP камер ажиллахгүй'), location.protocol==='https:'?'ok':'er');
add('🔒 isSecureContext: <b>' + window.isSecureContext + '</b>', window.isSecureContext?'ok':'er');
add('📱 mediaDevices: <b>' + (!!navigator.mediaDevices) + '</b>', navigator.mediaDevices?'ok':'er');
add('🎥 getUserMedia: <b>' + (!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) + '</b>', (navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)?'ok':'er');

async function test() {
  add('⏳ getUserMedia дуудаж байна...');

  // Minimal constraint — most permissive
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    add('✅ Амжилттай нээгдлээ! Track: ' + s.getVideoTracks()[0]?.label, 'ok');
    vid.srcObject = s;
    vid.style.display = 'block';
    vid.play().then(()=>add('✅ Video тоглож байна', 'ok')).catch(e=>add('❌ play() алдаа: '+e,'er'));
  } catch(e) {
    add('❌ Алдаа: <b>' + e.name + '</b>: ' + e.message, 'er');
    if (e.name === 'NotAllowedError')  add('👉 Шийдэл: хуудсыг refresh хийгээд камер зөвшөөрнө үү', 'wa');
    if (e.name === 'NotFoundError')    add('👉 Камер hardware олдсонгүй', 'er');
    if (e.name === 'NotReadableError') add('👉 Камер өөр app ашиглаж байна — бусад app-аа хаана уу', 'wa');
    if (e.name === 'SecurityError')    add('👉 HTTPS шаардлагатай', 'er');
  }
}
</script>
</body>
</html>
