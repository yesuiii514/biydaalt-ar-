<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>AR Меню</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif}

#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}

#overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0d0d0d,#1a1200);
  color:#fff;padding:32px;transition:opacity .5s;
}
#overlay.hidden{opacity:0;pointer-events:none}
.logo-big{font-size:64px;margin-bottom:16px;animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ov-title{font-size:28px;font-weight:700;letter-spacing:3px;margin-bottom:10px}
.ov-sub{font-size:14px;color:rgba(255,255,255,.5);text-align:center;line-height:1.7;margin-bottom:40px}
.start-btn{
  background:#e8a838;color:#000;border:none;border-radius:50px;
  padding:16px 44px;font-size:17px;font-weight:700;cursor:pointer;
  box-shadow:0 0 32px rgba(232,168,56,.5);
}

#err-panel{
  position:fixed;inset:0;z-index:60;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.96);color:#fff;padding:32px;text-align:center;
}
.err-steps{background:rgba(255,255,255,.06);border-radius:16px;padding:18px 20px;text-align:left;width:100%;max-width:360px;margin-bottom:24px}
.err-step{font-size:13px;color:rgba(255,255,255,.75);padding:8px 0;border-bottom:.5px solid rgba(255,255,255,.08);line-height:1.5}
.err-step:last-child{border:none}
.err-step b{color:#e8a838}
.retry-btn{background:#e8a838;color:#000;border:none;border-radius:50px;padding:14px 36px;font-size:16px;font-weight:700;cursor:pointer}

#info{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:rgba(10,10,10,.93);
  border-bottom:.5px solid rgba(232,168,56,.3);
  padding:16px 52px 16px 20px;display:none;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  animation:slideDown .3s ease;
}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.info-row{display:flex;align-items:center;gap:16px}
.info-emoji{font-size:50px;flex-shrink:0}
.info-name{font-size:19px;font-weight:700;color:#fff;margin-bottom:3px}
.info-desc{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:5px}
.info-price{font-size:22px;font-weight:800;color:#e8a838}
.info-close{
  position:absolute;top:14px;right:14px;
  background:rgba(255,255,255,.1);border:none;color:#fff;
  width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* Canvas — full area above bottom strip, touch enabled */
#three-canvas{
  position:fixed;
  left:50%;top:calc(50% - 40px);
  transform:translate(-50%,-58%);
  width:320px;height:320px;
  z-index:10;display:none;
  touch-action:none;
}

/* Gesture hint */
#gesture-hint{
  position:fixed;left:50%;z-index:11;
  transform:translateX(-50%);
  display:none;
  background:rgba(0,0,0,.55);border-radius:20px;
  padding:5px 14px;font-size:12px;color:rgba(255,255,255,.6);
  white-space:nowrap;pointer-events:none;
}

#loading{
  position:fixed;inset:0;z-index:45;display:none;
  align-items:center;justify-content:center;
  flex-direction:column;gap:16px;color:#fff;
  background:rgba(0,0,0,.55);
}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#e8a838;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  padding:0 12px 28px;display:none;
}
.hint-txt{
  text-align:center;color:rgba(255,255,255,.55);font-size:12px;
  margin-bottom:10px;background:rgba(0,0,0,.55);border-radius:20px;
  padding:5px 14px;display:inline-block;width:100%;
}
